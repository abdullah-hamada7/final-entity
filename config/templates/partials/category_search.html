<div class="products-search-block">
    <form method="GET" action="{{ search_action }}" id="categorySearchForm" class="products-search-form" novalidate>
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input
                type="search"
                name="search"
                id="categorySearchInput"
                placeholder="ابحث في هذا القسم..."
                value="{{ search_query }}"
                autocomplete="off"
                enterkeyhint="search"
                maxlength="100"
            >
            <button type="submit" class="search-btn">
                <i class="fas fa-search"></i>
                بحث
            </button>
        </div>
    </form>

    {% if search_query %}
    <div class="search-results-banner">
        <p>
            نتائج البحث عن: "{{ search_query }}"
            <a href="{{ clear_search_url }}" class="search-clear-link">
                <i class="fas fa-times-circle"></i> إلغاء البحث
            </a>
        </p>
    </div>
    {% endif %}
</div>
